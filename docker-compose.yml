services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: 
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - UPLOAD_FOLDER=/app/imports
      - BACKGROUND_MAX_THREADS=5
      - MIN_COUNTRY_VISIT_DURATION_FOR_STATS=300
      - MIN_CITY_VISIT_DURATION_FOR_STATS=3600
    volumes:
      - imports:/app/imports
      - ./VERSION:/app/VERSION

  nginx:
    build: ./nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
  imports: